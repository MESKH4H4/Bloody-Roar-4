<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloody Roar 4 HD - Comparison Hub</title>
    
    <!-- Slider Component -->
    <script defer src="https://unpkg.com/img-comparison-slider@7/dist/index.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/img-comparison-slider@7/dist/styles.css" />

    <style>
        :root {
            --beast-red: #cc0000;
            --beast-yellow: #ffcc00;
            --steel-dark: #0f1015;
            --card-bg: #161821;
            --border-color: #2b2e3e;
            --text-light: #eceff4;
            --text-muted: #6c757d;
        }

        body { 
            font-family: 'Arial Black', Gadget, sans-serif; 
            background-color: var(--steel-dark); 
            color: var(--text-light); 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Fundo escuro com uma névoa carmesim de combate beast */
            background-image: radial-gradient(circle at center, #2a0808 0%, #0f1015 100%);
        }

        .container { 
            max-width: 1100px; 
            width: 100%; 
            text-align: center; 
        }

        header { 
            padding: 35px 0; 
            margin-bottom: 25px; 
            border-bottom: 4px solid var(--beast-red);
            box-shadow: 0 8px 30px rgba(204, 0, 0, 0.4);
            position: relative;
        }

        header::after {
            content: 'BEAST UNLEASHED';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: var(--beast-yellow);
            font-size: 0.75rem;
            padding: 2px 12px;
            border: 1px solid var(--beast-red);
            border-radius: 2px;
            letter-spacing: 3px;
        }
        
        h1 { 
            color: var(--text-light); 
            margin: 0; 
            font-size: 2.5rem; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            font-style: italic;
            text-shadow: 3px 3px 0px var(--beast-red), -1px -1px 0px #000;
        }

        .subtitle {
            color: var(--beast-yellow);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-top: 8px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }
        
        .category-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn-cat {
            background: #1c1f2c;
            border: 2px solid var(--beast-red);
            color: #ffffff;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .btn-cat.active {
            border-color: var(--beast-yellow);
            background: var(--beast-red);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.6);
        }

        .image-selector {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .btn-img {
            width: 48px;
            height: 48px;
            border: 2px solid var(--beast-red);
            background: #1c1f2c;
            color: #ffffff;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            font-size: 1.1rem;
            /* Recorte angular estilizado simulando corte de garra */
            clip-path: polygon(15% 0, 100% 0, 85% 100%, 0% 100%);
        }

        .btn-img.active {
            background: var(--beast-yellow);
            border-color: #ffffff;
            color: #000000;
            transform: scale(1.15) translateY(-2px);
            box-shadow: 0 0 15px var(--beast-yellow);
        }

        .comparison-area {
            background: var(--card-bg);
            padding: 8px;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 50px rgba(0,0,0,0.95);
            border-radius: 4px;
        }

        img-comparison-slider {
            width: 100%;
            --divider-color: var(--beast-red);
            --default-handle-color: var(--beast-red);
        }

        img-comparison-slider img {
            width: 100%;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        .label-box {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            font-weight: bold;
            color: var(--beast-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.95rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        footer { 
            margin-top: 60px; 
            color: var(--text-muted); 
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-family: sans-serif;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Bloody Roar 4 HD</h1>
            <div class="subtitle">PS2 HD Texture Pack Showcase</div>
        </header>

        <div class="category-menu">
            <button class="btn-cat active" onclick="setCategory('ps2_vs_hd', this)">PS2 Native vs HD Standard</button>
            <button class="btn-cat" onclick="setCategory('hd_vs_vivid', this)">HD Standard vs Vivid Profile</button>
        </div>

        <div class="image-selector" id="imgSelector"></div>

        <div class="comparison-area">
            <div class="label-box">
                <span id="label-left">Original</span>
                <span id="label-right">HD</span>
            </div>
            
            <img-comparison-slider id="slider">
                <img slot="first" id="img-before" src="" />
                <img slot="second" id="img-after" src="" />
            </img-comparison-slider>
        </div>

        <footer>
            PROJETO DESENVOLVIDO POR MESKH4H4 | BLOODY ROAR 4 HD 2026
        </footer>
    </div>

    <script>
        // Altere a URL abaixo para o repositório correto do Bloody Roar 4 no seu GitHub
        const baseUrl = "https://meskh4h4.github.io/Bloody-Roar-4/comparacoes";
        
        let currentCategory = 'ps2_vs_hd';
        let currentIndex = 0;

        const configs = {
            'ps2_vs_hd': {
                leftDir: 'PS2/ps2',      // Pasta PS2 / ps2-0.png até ps2-3.png
                rightDir: 'HD/hd',       // Pasta HD / hd-0.png até hd-3.png
                labelL: 'PS2 Emulador Native',
                labelR: 'HD Texture Pack'
            },
            'hd_vs_vivid': {
                leftDir: 'HD/hd',
                rightDir: 'VIVID/vivid',  // Pasta VIVID / vivid-0.png até vivid-3.png
                labelL: 'HD Padrão',
                labelR: 'Vivid Enhanced (Color Profile)'
            }
        };

        function initSelector() {
            const selector = document.getElementById('imgSelector');
            selector.innerHTML = ''; 
            // Configurado para 4 imagens: botões de 0 até 3
            for (let i = 0; i <= 3; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = 'btn-img' + (i === currentIndex ? ' active' : '');
                btn.onclick = () => setIndex(i, btn);
                selector.appendChild(btn);
            }
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateImages();
        }

        function setIndex(idx, btn) {
            currentIndex = idx;
            document.querySelectorAll('.btn-img').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateImages();
        }

        function updateImages() {
            const config = configs[currentCategory];
            const imgBefore = document.getElementById('img-before');
            const imgAfter = document.getElementById('img-after');
            
            const cacheBuster = `?t=${new Date().getTime()}`;
            
            const newSrcBefore = `${baseUrl}/${config.leftDir}-${currentIndex}.png${cacheBuster}`;
            const newSrcAfter = `${baseUrl}/${config.rightDir}-${currentIndex}.png${cacheBuster}`;

            imgBefore.src = newSrcBefore;
            imgAfter.src = newSrcAfter;

            document.getElementById('label-left').innerText = config.labelL;
            document.getElementById('label-right').innerText = config.labelR;
        }

        initSelector();
        updateImages();
    </script>
</body>
</html>
